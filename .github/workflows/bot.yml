name: Telegram bot

on:
  schedule:
    # Every 5 minutes (GitHub may delay this a bit under load).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt

      - name: Poll Telegram and process links
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: python bot/bot.py
